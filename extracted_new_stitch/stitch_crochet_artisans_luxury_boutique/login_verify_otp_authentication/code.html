<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-4">

<img alt="CrochCosmo Brand Logo" class="w-24 h-24 rounded-lg object-cover mb-6" src="https://lh3.googleusercontent.com/aida/AP1WRLvqdPN2Zd5xpchku55cqMzqGRQa7MxCeHMsLhiTbwKQ8imgMqlDg1CyghZ2k8KZM_a9vBfvR4JMOOQwrq7L1PnSKPbNNx11QlByVN91SmDOhUtOsD0FQKhJiQuqFqPZA568KrgPj8ST9L3TJ8109AHmHh8BWc9f9YBtg8CKWe0BBXv0FnQql1ArCTRjzTyGjmXFMpxUMtPxQMqAl3nSSEwHVlLFIlNsxJ1U1VPNXNQYEUXU4aHRMKZcuMFt"/>
<h1 class="font-headline-md text-headline-md text-on-surface text-center mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-xs">Enter your mobile number to receive a secure login code.</p>
</div>
<!-- Step 1: Phone Number Input (Visible by default) -->
<div class="space-y-6 block" id="step-phone">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase" for="mobile-number">Mobile Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-on-surface-variant font-body-lg text-body-lg">
                        +1
                    </span>
<input autocomplete="tel" class="w-full bg-surface-bright border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder-outline transition-colors duration-300" id="mobile-number" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-body-md text-body-md font-medium py-4 rounded-lg transition-colors duration-300 flex items-center justify-center gap-2" onclick="showOTPStep()" type="button">
                Get OTP
                <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
<!-- Step 2: OTP Verification (Hidden by default) -->
<div class="space-y-6 hidden" id="step-otp">
<div class="flex items-center justify-between mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase">Enter 6-Digit Code</label>
<button class="text-secondary font-label-caps text-label-caps hover:underline uppercase transition-all" onclick="showPhoneStep()" type="button">Edit Number</button>
</div>
<div class="flex gap-2 justify-between">
<input class="w-12 h-14 text-center bg-surface-bright border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg font-headline-sm text-headline-sm text-on-surface transition-colors duration-300" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input class="w-12 h-14 text-center bg-surface-bright border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg font-headline-sm text-headline-sm text-on-surface transition-colors duration-300" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input class="w-12 h-14 text-center bg-surface-bright border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg font-headline-sm text-headline-sm text-on-surface transition-colors duration-300" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input class="w-12 h-14 text-center bg-surface-bright border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg font-headline-sm text-headline-sm text-on-surface transition-colors duration-300" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input class="w-12 h-14 text-center bg-surface-bright border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg font-headline-sm text-headline-sm text-on-surface transition-colors duration-300" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input class="w-12 h-14 text-center bg-surface-bright border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg font-headline-sm text-headline-sm text-on-surface transition-colors duration-300" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>

                Verify &amp; Login
            </button>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-4">
                Didn't receive a code? <button class="text-secondary font-medium hover:underline" type="button">Resend</button>
</p>
</div>
</div>
<script>
        function showOTPStep() {
            document.getElementById('step-phone').classList.add('hidden');
            document.getElementById('step-otp').classList.remove('hidden');
            
            // Auto-focus first OTP input
            const firstOtpInput = document.querySelector('#step-otp input');
            if(firstOtpInput) {
                setTimeout(() => firstOtpInput.focus(), 100);
            }
        }

        function showPhoneStep() {
            document.getElementById('step-otp').classList.add('hidden');
            document.getElementById('step-phone').classList.remove('hidden');
        }
        
        // Simple auto-advance for OTP inputs
        const otpInputs = document.querySelectorAll('#step-otp input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                if(this.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', function(e) {
                if(e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });
    </script>
